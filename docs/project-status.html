<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BC_Telemetry — Project status</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#f8f9fb;--bg3:#f1f3f7;--border:#dde1ea;--accent:#1d4ed8;--accent2:#2563eb;
--green:#16a34a;--yellow:#b45309;--red:#dc2626;--gray:#64748b;--text:#0f172a;--text2:#334155;--text3:#64748b;
--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;}
:root[data-theme="dark"]{
--bg:#0f172a;--bg2:#161f2e;--bg3:#1e293b;--border:#293548;
--accent:#3b82f6;--accent2:#60a5fa;--green:#22c55e;--yellow:#d99a3a;--red:#f05252;--gray:#94a3b8;
--text:#e6edf6;--text2:#c4d0de;--text3:#8b9bb0;}
*{box-sizing:border-box;margin:0;padding:0;}
html{transition:background .2s,color .2s;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;}
.wrap{max-width:1080px;margin:0 auto;padding:40px 32px 80px;}
header.top{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:28px;position:relative;}
.controls{position:absolute;top:0;right:0;display:flex;align-items:center;gap:8px;}
.push{font-family:var(--mono);font-size:11px;color:var(--accent2);text-decoration:none;border:1px solid var(--border);border-radius:7px;padding:5px 11px;background:var(--bg2);display:inline-flex;align-items:center;gap:6px;}
.push:hover{border-color:var(--accent);}
.push b{color:var(--text);font-weight:600;}
.tbtn{font-size:14px;line-height:1;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;cursor:pointer;color:var(--text);}
.tbtn:hover{border-color:var(--accent);}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;}
header.top h1{font-size:28px;font-weight:300;letter-spacing:-.5px;margin:6px 0 4px;}
header.top h1 strong{font-weight:600;}
.sub{color:var(--text2);font-size:14px;}
.meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--text3);}
.meta b{color:var(--text2);font-weight:600;}
.meta a{color:var(--accent2);text-decoration:none;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.kpi .l{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.kpi .v{font-size:28px;font-weight:300;letter-spacing:-1px;}
.kpi .v small{font-size:14px;color:var(--text3);}
.progress{height:8px;background:var(--bg3);border-radius:5px;overflow:hidden;margin:18px 0 32px;}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));}
h2.sec{font-size:13px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin:0 0 16px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.ms{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--border);}
.ms:last-child{border-bottom:none;}
.ms-icon{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;font-family:var(--mono);}
.ms-body{flex:1;}
.ms-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ms-head h3{font-size:15px;font-weight:600;}
.ms-id{font-family:var(--mono);font-size:11px;color:var(--text3);}
.ms-desc{color:var(--text2);font-size:13px;margin:4px 0 8px;}
.items{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
.item{font-size:12px;color:var(--text2);display:flex;gap:8px;align-items:flex-start;}
.item .b{font-family:var(--mono);flex-shrink:0;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
.p-done{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.p-prog{background:rgba(37,99,235,.12);color:var(--accent2);border:1px solid rgba(37,99,235,.25);}
.p-block{background:rgba(180,83,9,.12);color:var(--yellow);border:1px solid rgba(180,83,9,.3);}
.p-todo{background:rgba(100,116,139,.1);color:var(--gray);border:1px solid var(--border);}
.i-done{background:rgba(34,197,94,.12);color:var(--green);}
.i-prog{background:rgba(37,99,235,.12);color:var(--accent2);}
.i-block{background:rgba(180,83,9,.12);color:var(--yellow);}
.i-todo{background:rgba(100,116,139,.1);color:var(--gray);}
.section{margin-bottom:38px;}
.dec{background:rgba(180,83,9,.05);border:1px solid rgba(180,83,9,.2);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.dec h4{font-size:13px;margin-bottom:4px;}
.dec p{font-size:12px;color:var(--text2);}
.dec .opts{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:6px;}
.timeline{display:flex;flex-direction:column;gap:0;}
.tl{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;}
.tl:last-child{border-bottom:none;}
.tl .sha{font-family:var(--mono);font-size:11px;color:var(--accent2);flex-shrink:0;width:64px;}
.tl .msg{color:var(--text2);}
.arch{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px 20px;font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.9;white-space:pre;overflow-x:auto;}
.foot{margin-top:48px;padding-top:20px;border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--text3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr);}}
</style>
<script>(function(){var t=localStorage.getItem('bct-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const ICON = {done:'✓',prog:'◐',block:'⚠',todo:'·'};
const PILL = {done:'p-done',prog:'p-prog',block:'p-block',todo:'p-todo'};
const PILLTXT = {done:'Hotovo',prog:'Probíhá',block:'Blokováno',todo:'Plánováno'};
const ISTAT = {done:'i-done',prog:'i-prog',block:'i-block',todo:'i-todo'};
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Push číslo + commit (jako topbar v ITDashboardu)
const pushLink = document.getElementById('pushLink');
pushLink.href = D.repoUrl + '/commit/' + D.commit;
pushLink.innerHTML = '⬆ Push <b>#' + D.pushNo + '</b> · ' + esc(D.commit);

// Dark / light přepínač (perzistentní v localStorage)
const themeBtn = document.getElementById('themeBtn');
function applyThemeLabel(){ themeBtn.textContent = (document.documentElement.getAttribute('data-theme')==='dark') ? '☀' : '🌙'; }
applyThemeLabel();
themeBtn.addEventListener('click', ()=>{
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('bct-theme', next);
  applyThemeLabel();
});

document.getElementById('brand').textContent = D.brand;
document.getElementById('subtitle').textContent = D.subtitle;
document.getElementById('meta').innerHTML =
  `<span><b>Repo:</b> <a href="${D.repoUrl}">${esc(D.repo)}</a></span>`+
  `<span><b>Host:</b> ${esc(D.host)}</span>`+
  `<span><b>Verze:</b> ${esc(D.version)}</span>`+
  `<span><b>Commit:</b> ${esc(D.commit)}</span>`+
  `<span><b>Aktualizováno:</b> ${esc(D.generated)}</span>`;

const ms = D.milestones;
const done = ms.filter(m=>m.status==='done').length;
const pct = Math.round(100*done/ms.length);
const blocked = ms.filter(m=>m.status==='block'||m.status==='blocked').length;
const kpis = [
  {l:'Milestones hotové',v:`${done}<small>/${ms.length}</small>`},
  {l:'Dokončeno',v:`${pct}<small>%</small>`},
  {l:'Otevřená rozhodnutí',v:D.decisions.length},
  {l:'Aktivní maxferit projekt',v:`#${D.activeProjectNo}`}
];
document.getElementById('kpis').innerHTML = kpis.map(k=>`<div class="kpi"><div class="l">${k.l}</div><div class="v">${k.v}</div></div>`).join('');
document.getElementById('pfill').style.width = pct+'%';

document.getElementById('milestones').innerHTML = ms.map(m=>{
  const st = m.status==='blocked'?'block':m.status;
  const items = (m.items||[]).map(i=>`<div class="item"><span class="b" style="color:var(--${i.s==='done'?'green':i.s==='block'?'yellow':i.s==='prog'?'accent2':'gray'})">${ICON[i.s]||'·'}</span><span>${esc(i.t)}</span></div>`).join('');
  return `<div class="ms">
    <div class="ms-icon ${ISTAT[st]}">${ICON[st]}</div>
    <div class="ms-body">
      <div class="ms-head"><span class="ms-id">${m.id}</span><h3>${esc(m.title)}</h3><span class="pill ${PILL[st]}">${PILLTXT[st]}</span></div>
      <div class="ms-desc">${esc(m.desc)}</div>
      <div class="items">${items}</div>
    </div></div>`;
}).join('');

document.getElementById('decisions').innerHTML = D.decisions.map(d=>
  `<div class="dec"><h4>${esc(d.h)}</h4><p>${esc(d.p)}</p><div class="opts">${esc(d.o)}</div></div>`).join('');

document.getElementById('arch').textContent = D.arch;

document.getElementById('timeline').innerHTML = D.timeline.slice().reverse().map(t=>
  `<div class="tl"><span class="sha">${esc(t.sha)}</span><span class="msg">${esc(t.msg)}</span></div>`).join('');

document.getElementById('footL').textContent = `${D.repo} · v${D.version}`;
document.getElementById('footR').textContent = `${done}/${ms.length} milestones · ${pct}% · ${D.generated}`;
</script>
